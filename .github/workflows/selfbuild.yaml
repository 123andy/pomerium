# Build-and-scan only. Builds upstream's root Dockerfile for a given ref,
# never pushes: no registry login and push: false. The image itself is not
# uploaded (artifacts on a public repo are downloadable by any signed-in user);
# only the scan result is kept, for 3 days.
name: Self-build (no publish)

# workflow_dispatch only works once this file is on the default branch, which
# this fork leaves untouched; until then a push to selfbuild-ci builds the
# refs listed in DEFAULT_REFS.
on:
  push:
    branches: [selfbuild-ci]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA in this repo to build"
        required: true
        type: string

permissions:
  contents: read

env:
  # build-push-action otherwise uploads a 90-day build-record artifact.
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DEFAULT_REFS: '["sci-0.33.6-deps","sci-0.34.1"]'

jobs:
  refs:
    runs-on: ubuntu-24.04
    outputs:
      refs: ${{ steps.r.outputs.refs }}
    steps:
      - id: r
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$INPUT_REF" ]; then
            echo "refs=$(jq -cn --arg r "$INPUT_REF" '[$r]')" >> "$GITHUB_OUTPUT"
          else
            echo "refs=$DEFAULT_REFS" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: refs
    name: build ${{ matrix.ref }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.refs) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream tags (for git describe)
        run: git fetch --no-recurse-submodules https://github.com/pomerium/pomerium.git '+refs/tags/v0.3*:refs/tags/v0.3*'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          tags: pomerium-selfbuild:local
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Load image and print version
        run: |
          docker load -i "$RUNNER_TEMP/image.tar"
          docker image inspect pomerium-selfbuild:local --format '{{.Id}} {{.Architecture}}'
          docker run --rm pomerium-selfbuild:local --version

      - name: Trivy (HIGH,CRITICAL, fixable only)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm -v "$RUNNER_TEMP:/w" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /w/image.tar --severity HIGH,CRITICAL --ignore-unfixed --format json --output /w/out/trivy.json
          docker run --rm -v "$RUNNER_TEMP:/w" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            convert --format table /w/out/trivy.json

      - name: Upload scan result (3 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.ref }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/trivy.json
          retention-days: 3
